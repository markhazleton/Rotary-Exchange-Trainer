kind = "web"
previewPath = "/"
title = "Rotary District 5680 Leadership Training"
version = "1.0.0"
id = "artifacts/rotary-training"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23835

[services.development]
run = "pnpm --filter @workspace/rotary-training run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rotary-training", "run", "build" ]
publicDir = "artifacts/rotary-training/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23835"
BASE_PATH = "/"
